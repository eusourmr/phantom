name: Build and Release Phantom

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Build Phantom
        shell: pwsh
        run: |
          cargo build --release -p phantom-browser

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          Copy-Item `
            "target/release/phantom-browser.exe" `
            "dist/Phantom.exe"

          Compress-Archive `
            -Path "dist/Phantom.exe" `
            -DestinationPath "dist/Phantom-${{ github.ref_name }}-windows-x86_64.zip"

          $hash = Get-FileHash `
            "dist/Phantom-${{ github.ref_name }}-windows-x86_64.zip" `
            -Algorithm SHA256

          "$($hash.Hash)  Phantom-${{ github.ref_name }}-windows-x86_64.zip" |
            Out-File `
              "dist/SHA256SUMS.txt" `
              -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Windows-x86_64
          path: |
            dist/Phantom.exe
            dist/Phantom-*.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Phantom-${{ github.ref_name }}-windows-x86_64.zip" `
            "dist/SHA256SUMS.txt" `
            --title "Phantom ${{ github.ref_name }}" `
            --notes "First public technical preview of the Phantom independent web browser." `
            --prerelease
