<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Native Interaction Events I</title>
  <style>
    #status.allowed { color: #2e7d32; }
    #status.blocked { color: #c62828; }
    #status.plain { color: #5e35b1; }
  </style>
</head>
<body>
  <div id="panel">
    <a id="allowed" href="/allowed-target.html">Allowed link</a>
    <a id="blocked" href="/blocked-target.html">Blocked link</a>
    <form id="search" action="/submit-target.html" method="get">
      <input id="query" type="text" name="q" value="phantom">
      <button id="submit" type="submit" name="go" value="1">Submit</button>
    </form>
    <div id="plain">Plain target</div>
    <p id="status">waiting</p>
  </div>
  <script src="/native-interaction.js"></script>
</body>
</html>
