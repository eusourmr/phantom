<!doctype html><html><head><title>Dynamic Integration</title><style>#target { color: blue; }</style></head><body><main id="root"><p id="target">Before script</p></main><script>var target = document.getElementById('target'); target.textContent = 'Styled by script'; target.setAttribute('style', 'color:#ff0000'); var child = document.createElement('p'); child.textContent = 'Created by script'; document.getElementById('root').appendChild(child);</script></body></html>
