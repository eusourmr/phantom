<!doctype html><html><head><title>Corpus Async</title></head><body><p id="fetch-result">Waiting</p><p id="timer-result">Waiting</p><script>fetch('/data.txt').then(function(response) { response.text().then(function(value) { document.getElementById('fetch-result').textContent = value; }); }); setTimeout(function() { document.getElementById('timer-result').textContent = 'Timer fired'; }, 25);</script></body></html>
